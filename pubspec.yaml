name: dasko_ai
description: "Dasko AI - Advanced personal AI companion with clean architecture."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.4.1
  audioplayers: ^6.5.0
  flutter_tts: ^4.2.3
  model_viewer_plus: 1.10.0
  webview_flutter: ^4.11.0

  # State management
  flutter_riverpod: ^2.6.1
  # Functional programming & equality
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/persona/
    - assets/sounds/
    - assets/images/
    - assets/icon/
    - assets/models/

# flutter_launcher_icons is kept as a dev dependency only.
# Enable the block below after adding assets/icon/dasko_icon.png (512x512).
# flutter_launcher_icons:
#   android: true
#   ios: true
#   image_path: "assets/icon/dasko_icon.png"
#   min_sdk_android: 21
#   remove_alpha_ios: true
