name: Build APK

on:
  push:
    branches:
      - main
      - experimental-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dasko-android-version-allocation
  cancel-in-progress: false

jobs:
  test_build_tooling:
    name: Test Android build tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test isolated version reservations
        run: bash tooling/test_allocate_android_version.sh

      - name: Test pinned Android SDK setup guards
        run: bash tooling/test_setup_environment.sh

  reserve_version:
    needs: test_build_tooling
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.allocate.outputs.version_name }}
      version_code: ${{ steps.allocate.outputs.version_code }}
    steps:
      - name: Checkout repository for version allocation
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reserve a unique Android version code
        id: allocate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bash tooling/allocate_android_version.sh

  build:
    needs: reserve_version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Apply reserved Android version
        shell: bash
        env:
          DASKO_VERSION_NAME: ${{ needs.reserve_version.outputs.version_name }}
          DASKO_VERSION_CODE: ${{ needs.reserve_version.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - "$DASKO_VERSION_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          if not re.fullmatch(r"\d+\.\d+\.\d+\+\d+", version):
              raise SystemExit("::error::Reserved Flutter version has invalid format")
          path = Path("pubspec.yaml")
          content, count = re.subn(
              r"(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$",
              f"version: {version}",
              path.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit("::error::Expected one pubspec version field")
          path.write_text(content)
          PY
          if [[ ! "$DASKO_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Reserved Android versionCode is invalid."
            exit 1
          fi
          echo "DASKO_VERSION_CODE=$DASKO_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Validate local 3D model and Android network policy
        run: python3 tooling/validate_dasko_robot_assets.py

      - name: Test Android certificate digest verifier
        shell: bash
        run: bash tooling/test_android_certificate_verifier.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Require tracked Android project
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            android/settings.gradle.kts
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/res/xml/network_security_config.xml
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradlew
            android/gradlew.bat
            assets/models/dasko_robot.glb
            assets/images/dasko_robot_poster.png
            tooling/validate_dasko_robot_assets.py
          )
          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required tracked Android project file is missing: $file"
              exit 1
            fi
          done
          git ls-files --error-unmatch "${required_files[@]}" >/dev/null
          for private_file in \
            android/local.properties \
            android/key.properties \
            android/app/dasko-upload-keystore.jks \
            android/app/google-services.json; do
            if git ls-files --error-unmatch "$private_file" >/dev/null 2>&1; then
              echo "::error::Local or generated Android file must not be tracked: $private_file"
              exit 1
            fi
            if ! git check-ignore -q "$private_file"; then
              echo "::error::Sensitive or generated Android file is not protected by .gitignore: $private_file"
              exit 1
            fi
          done
          echo "Android project files are present and tracked."

      - name: Configure local Android and Flutter SDK paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK was not found on the runner."
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-36" ]; then
            echo "::error::Android SDK platform android-36 is required by Flutter 3.47.8."
            exit 1
          fi
          HAS_REQUIRED_BUILD_TOOLS=false
          for AAPT in "$SDK_ROOT"/build-tools/*/aapt; do
            [ -x "$AAPT" ] || continue
            if [ -x "${AAPT%/aapt}/apksigner" ]; then
              HAS_REQUIRED_BUILD_TOOLS=true
              break
            fi
          done
          if [ "$HAS_REQUIRED_BUILD_TOOLS" != true ]; then
            echo "::error::Android SDK build-tools must include executable aapt and apksigner."
            exit 1
          fi
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_SDK"
            printf 'sdk.dir=%s\n' "$SDK_ROOT"
          } > android/local.properties

      - name: Record Flutter and Android toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          echo "::group::Android Gradle settings"
          sed -n '1,120p' android/settings.gradle.kts
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "::endgroup::"

      - name: Configure Firebase Android
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="google-services.json"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::Firebase configuration file not found: $SOURCE"
            exit 1
          fi
          python3 - "$SOURCE" android/app/build.gradle.kts <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          config_path, gradle_path = map(Path, sys.argv[1:])
          gradle = gradle_path.read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle)
          if not match:
              raise SystemExit("::error::Unable to read Android applicationId")
          application_id = match.group(1)
          config = json.loads(config_path.read_text())
          clients = config.get("client", [])
          matches = [
              client for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == application_id
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"::error::Expected one Firebase client for {application_id}; found {len(matches)}"
              )
          PY
          cp "$SOURCE" android/app/google-services.json
          grep -Fq 'id("com.google.gms.google-services") version "4.5.0" apply false' android/settings.gradle.kts
          grep -Fq 'id("com.google.gms.google-services")' android/app/build.gradle.kts
          grep -Fq 'rootProject.file("key.properties")' android/app/build.gradle.kts
          echo "Firebase plugin is declared in tracked Gradle configuration."

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s pubspec.lock ]; then
            echo "::error::pubspec.lock is required for reproducible application builds."
            exit 1
          fi
          flutter pub get --enforce-lockfile

      - name: Verify Dart formatting without modifying files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d lib ] || [ ! -d test ]; then
            echo "::error::Required lib/ or test/ directory is missing."
            exit 1
          fi
          mapfile -d '' DART_FILES < <(find lib test -type f -name '*.dart' -print0 | sort -z)
          if [ "${#DART_FILES[@]}" -eq 0 ]; then
            echo "::error::No Dart source files found under lib/ and test/."
            exit 1
          fi
          dart format --output=none --set-exit-if-changed "${DART_FILES[@]}"

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests (required)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d test ]; then
            echo "::error::Required test/ directory is missing."
            exit 1
          fi
          mapfile -d '' TEST_FILES < <(find test -type f -name '*_test.dart' -print0 | sort -z)
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::No *_test.dart files found under test/. Refusing to build without tests."
            exit 1
          fi
          printf 'Found %d Dart test file(s):\n' "${#TEST_FILES[@]}"
          printf '  %s\n' "${TEST_FILES[@]}"
          flutter test --reporter expanded

      - name: Require persistent Android signing secrets
        shell: bash
        env:
          DASKO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DASKO_ANDROID_KEYSTORE_BASE64 }}
          DASKO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DASKO_ANDROID_KEYSTORE_PASSWORD }}
          DASKO_ANDROID_KEY_ALIAS: ${{ secrets.DASKO_ANDROID_KEY_ALIAS }}
          DASKO_ANDROID_KEY_PASSWORD: ${{ secrets.DASKO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DASKO_ANDROID_KEYSTORE_BASE64 DASKO_ANDROID_KEYSTORE_PASSWORD DASKO_ANDROID_KEY_ALIAS DASKO_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              echo "::error::Add all DASKO Android signing secrets using docs/ANDROID_SIGNING.md before building an installable APK."
              exit 1
            fi
          done

          printf '%s' "$DASKO_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dasko-upload-keystore.jks
          test -s android/app/dasko-upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$DASKO_ANDROID_KEYSTORE_PASSWORD
          keyPassword=$DASKO_ANDROID_KEY_PASSWORD
          keyAlias=$DASKO_ANDROID_KEY_ALIAS
          storeFile=dasko-upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove release signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/dasko-upload-keystore.jks

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools directory not found."
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$AAPT" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::aapt or apksigner missing; refusing to publish."
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.dasko.dasko_ai'" >/dev/null || {
            echo "::error::Unexpected application ID; refusing to publish."
            exit 1
          }
          APK_CODE="$(sed -n "s/^package:.* versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
          EXPECTED_CODE="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          if [ -z "$APK_CODE" ] || [ "$APK_CODE" != "$EXPECTED_CODE" ] || [ "$APK_CODE" != "$DASKO_VERSION_CODE" ]; then
            echo "::error::APK versionCode ($APK_CODE) differs from pubspec ($EXPECTED_CODE) or reservation ($DASKO_VERSION_CODE)."
            exit 1
          fi
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          echo "$SIGNATURE_OUTPUT"
          EXPECTED_CERT="f873f18b4f7103fcb4c875030fd3bd9582074af779395a3935c7bd94b71c398c"
          if ! bash -c 'source tooling/android_certificate_verifier.sh; verify_certificate_sha256 "$1" "$2"' _ "$SIGNATURE_OUTPUT" "$EXPECTED_CERT"; then
            echo "::error::Signing certificate fingerprint mismatch or unavailable."
            exit 1
          fi
          echo "APK application ID, versionCode, and signing certificate verified."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dasko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
