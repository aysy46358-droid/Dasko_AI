name: Build APK

on:
  push:
    branches:
      - main
      - experimental-work
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dasko-android-version-allocation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Test Android certificate digest verifier
        shell: bash
        run: bash tooling/test_android_certificate_verifier.sh

      - name: Reserve a unique Android version code
        shell: bash
        run: bash tooling/allocate_android_version.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            echo "Android folder not found. Generating..."
            flutter create --platforms=android --org com.dasko --project-name dasko_ai .
          else
            echo "Android folder already exists. Skipping generate."
          fi

      - name: Record Flutter and generated Android toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          echo "::group::Generated Android Gradle settings"
          if [ -f android/settings.gradle.kts ]; then sed -n '1,120p' android/settings.gradle.kts; fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then cat android/gradle/wrapper/gradle-wrapper.properties; fi
          echo "::endgroup::"

      - name: Require persistent Android signing secrets
        shell: bash
        env:
          DASKO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DASKO_ANDROID_KEYSTORE_BASE64 }}
          DASKO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DASKO_ANDROID_KEYSTORE_PASSWORD }}
          DASKO_ANDROID_KEY_ALIAS: ${{ secrets.DASKO_ANDROID_KEY_ALIAS }}
          DASKO_ANDROID_KEY_PASSWORD: ${{ secrets.DASKO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DASKO_ANDROID_KEYSTORE_BASE64 DASKO_ANDROID_KEYSTORE_PASSWORD DASKO_ANDROID_KEY_ALIAS DASKO_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              echo "::error::Add all DASKO Android signing secrets using docs/ANDROID_SIGNING.md before building an installable APK."
              exit 1
            fi
          done

          printf '%s' "$DASKO_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dasko-upload-keystore.jks
          test -s android/app/dasko-upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$DASKO_ANDROID_KEYSTORE_PASSWORD
          keyPassword=$DASKO_ANDROID_KEY_PASSWORD
          keyAlias=$DASKO_ANDROID_KEY_ALIAS
          storeFile=dasko-upload-keystore.jks
          EOF

      - name: Configure Firebase Android and persistent release signing
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="google-services.json"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::Firebase configuration file not found: $SOURCE"
            exit 1
          fi
          cp "$SOURCE" android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          def add_plugin(path, plugin_line):
              if not path.exists():
                  raise SystemExit(f"ERROR: Expected Gradle file missing: {path}")
              text = path.read_text()
              start = text.find("plugins {")
              if start < 0:
                  raise SystemExit(f"ERROR: plugins block not found in {path}")
              depth = 0
              end = -1
              for i in range(start + len("plugins"), len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end < 0:
                  raise SystemExit(f"ERROR: Invalid plugins block in {path}")
              if "com.google.gms.google-services" not in text[start:end]:
                  text = text[:end] + "    " + plugin_line + "\n" + text[end:]
                  path.write_text(text)

          add_plugin(settings, 'id("com.google.gms.google-services") version "4.5.0" apply false')
          add_plugin(app_gradle, 'id("com.google.gms.google-services")')

          text = app_gradle.read_text()
          if 'import java.util.Properties' not in text:
              text = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + text

          if 'val signingProperties = Properties()' not in text:
              marker = 'plugins {'
              start = text.find(marker)
              depth = 0
              end = -1
              for i in range(start + len(marker) - 1, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end < 0:
                  raise SystemExit("ERROR: Cannot locate app Gradle plugins block end.")
              signing = '''
          
          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("key.properties")
          if (!signingPropertiesFile.exists()) {
              throw GradleException("Missing android/key.properties; configure Android signing secrets.")
          }
          signingProperties.load(FileInputStream(signingPropertiesFile))
          '''
              text = text[:end] + signing + text[end:]

          if 'create("release")' not in text and 'create("daskoRelease")' not in text:
              android_marker = 'android {'
              android_start = text.find(android_marker)
              if android_start < 0:
                  raise SystemExit("ERROR: android block not found in app Gradle file.")
              signing_config = '''
              signingConfigs {
                  create("release") {
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                  }
              }

          '''
              text = text[:android_start + len(android_marker)] + "\n" + signing_config + text[android_start + len(android_marker):]

          text = text.replace('signingConfig = signingConfigs.getByName("debug")',
                              'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              raise SystemExit("ERROR: Could not set release build to the persistent signing config.")
          app_gradle.write_text(text)
          print("Firebase plugin and persistent release signing configured.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Apply Dart formatting to identify repository fixes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d lib ] || [ ! -d test ]; then
            echo "::error::Required lib/ or test/ directory is missing."
            exit 1
          fi
          mapfile -d '' DART_FILES < <(find lib test -type f -name '*.dart' -print0 | sort -z)
          if [ "${#DART_FILES[@]}" -eq 0 ]; then
            echo "::error::No Dart source files found under lib/ and test/."
            exit 1
          fi
          dart format "${DART_FILES[@]}"
          mkdir -p build/dart-format-review
          for file in "${DART_FILES[@]}"; do
            mkdir -p "build/dart-format-review/$(dirname "$file")"
            cp "$file" "build/dart-format-review/$file"
          done

      - name: Export formatted Dart sources for repository correction
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dart-formatted-sources
          path: build/dart-format-review/
          if-no-files-found: error

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests (required)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d test ]; then
            echo "::error::Required test/ directory is missing."
            exit 1
          fi
          mapfile -d '' TEST_FILES < <(find test -type f -name '*_test.dart' -print0 | sort -z)
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::No *_test.dart files found under test/. Refusing to build without tests."
            exit 1
          fi
          printf 'Found %d Dart test file(s):\n' "${#TEST_FILES[@]}"
          printf '  %s\n' "${TEST_FILES[@]}"
          flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools directory not found."
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$AAPT" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::aapt or apksigner missing; refusing to publish."
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.dasko.dasko_ai'" >/dev/null || {
            echo "::error::Unexpected application ID; refusing to publish."
            exit 1
          }
          APK_CODE="$(sed -n "s/^package:.* versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
          EXPECTED_CODE="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          if [ -z "$APK_CODE" ] || [ "$APK_CODE" != "$EXPECTED_CODE" ] || [ "$APK_CODE" != "$DASKO_VERSION_CODE" ]; then
            echo "::error::APK versionCode ($APK_CODE) differs from pubspec ($EXPECTED_CODE) or reservation ($DASKO_VERSION_CODE)."
            exit 1
          fi
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          echo "$SIGNATURE_OUTPUT"
          EXPECTED_CERT="f873f18b4f7103fcb4c875030fd3bd9582074af779395a3935c7bd94b71c398c"
          if ! bash -c 'source tooling/android_certificate_verifier.sh; verify_certificate_sha256 "$1" "$2"' _ "$SIGNATURE_OUTPUT" "$EXPECTED_CERT"; then
            echo "::error::Signing certificate fingerprint mismatch or unavailable."
            exit 1
          fi
          echo "APK application ID, versionCode, and signing certificate verified."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dasko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
