name: Build APK

on:
  push:
    branches:
      - main
      - experimental-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found. Generating..."
            flutter create --platforms=android --org com.dasko --project-name dasko_ai .
          else
            echo "Android folder already exists. Skipping generate."
          fi

      - name: Configure Firebase Android
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="google-services.json"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Firebase configuration file not found: $SOURCE"
            echo "Files available in repository root:"
            ls -la
            exit 1
          fi

          mkdir -p android/app
          cp "$SOURCE" android/app/google-services.json
          echo "Copied Firebase config to android/app/google-services.json"

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          def add_plugin(path, plugin_line):
              if not path.exists():
                  print(f"WARNING: {path} does not exist, skipping plugin injection")
                  return

              text = path.read_text()
              start = text.find("plugins {")

              if start < 0:
                  print(f"WARNING: plugins block not found in {path}")
                  return

              depth = 0
              end = -1

              for i in range(start + len("plugins"), len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break

              if end < 0:
                  print(f"WARNING: Invalid plugins block in {path}")
                  return

              if "com.google.gms.google-services" in text[start:end]:
                  print(f"Plugin already configured in {path}")
                  return

              text = text[:end] + "    " + plugin_line + "\n" + text[end:]
              path.write_text(text)
              print(f"Configured plugin in {path}")

          add_plugin(
              settings,
              'id("com.google.gms.google-services") version "4.5.0" apply false'
          )

          add_plugin(
              app_gradle,
              'id("com.google.gms.google-services")'
          )

          print("Firebase Android configuration prepared.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Apply Dart formatting before analysis
        run: dart format .

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "test" ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --reporter expanded
          else
            echo "::warning::No *_test.dart files found under test/. Automated tests were not executed."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dasko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
