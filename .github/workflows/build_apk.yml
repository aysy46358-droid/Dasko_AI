
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.dasko --project-name dasko_ai .

      - name: Configure Firebase Android
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="google-services (1).json"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Firebase configuration file not found: $SOURCE"
            echo "Files available in repository root:"
            ls -la
            exit 1
          fi

          cp "$SOURCE" android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          def add_plugin(path, plugin_line):
              text = path.read_text()
              start = text.find("plugins {")

              if start < 0:
                  raise SystemExit(f"ERROR: plugins block not found in {path}")

              depth = 0
              end = -1

              for i in range(start + len("plugins"), len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break

              if end < 0:
                  raise SystemExit(f"ERROR: Invalid plugins block in {path}")

              if "com.google.gms.google-services" in text[start:end]:
                  print(f"Plugin already configured in {path}")
                  return

              text = text[:end] + "    " + plugin_line + "\n" + text[end:]
              path.write_text(text)
              print(f"Configured plugin in {path}")

          if not settings.exists() or not app_gradle.exists():
              raise SystemExit("ERROR: Expected Kotlin Gradle files were not generated.")

          add_plugin(
              settings,
              'id("com.google.gms.google-services") version "4.5.0" apply false'
          )

          add_plugin(
              app_gradle,
              'id("com.google.gms.google-services")'
          )

          print("Firebase Android configuration prepared.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dasko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
