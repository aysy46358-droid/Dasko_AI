name: Build APK

on:
  push:
    branches:
      - main
      - experimental-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found. Generating..."
            flutter create --platforms=android --org com.dasko --project-name dasko_ai .
          else
            echo "Android folder already exists. Skipping generate."
          fi

      - name: Require persistent Android signing secrets
        shell: bash
        env:
          DASKO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DASKO_ANDROID_KEYSTORE_BASE64 }}
          DASKO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DASKO_ANDROID_KEYSTORE_PASSWORD }}
          DASKO_ANDROID_KEY_ALIAS: ${{ secrets.DASKO_ANDROID_KEY_ALIAS }}
          DASKO_ANDROID_KEY_PASSWORD: ${{ secrets.DASKO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DASKO_ANDROID_KEYSTORE_BASE64 DASKO_ANDROID_KEYSTORE_PASSWORD DASKO_ANDROID_KEY_ALIAS DASKO_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              echo "::error::Add all DASKO Android signing secrets using docs/ANDROID_SIGNING.md before building an installable APK."
              exit 1
            fi
          done

          printf '%s' "$DASKO_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dasko-upload-keystore.jks
          test -s android/app/dasko-upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$DASKO_ANDROID_KEYSTORE_PASSWORD
          keyPassword=$DASKO_ANDROID_KEY_PASSWORD
          keyAlias=$DASKO_ANDROID_KEY_ALIAS
          storeFile=app/dasko-upload-keystore.jks
          EOF

      - name: Configure Firebase Android and persistent release signing
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="google-services.json"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::Firebase configuration file not found: $SOURCE"
            exit 1
          fi
          cp "$SOURCE" android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          def add_plugin(path, plugin_line):
              if not path.exists():
                  raise SystemExit(f"ERROR: Expected Gradle file missing: {path}")
              text = path.read_text()
              start = text.find("plugins {")
              if start < 0:
                  raise SystemExit(f"ERROR: plugins block not found in {path}")
              depth = 0
              end = -1
              for i in range(start + len("plugins"), len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end < 0:
                  raise SystemExit(f"ERROR: Invalid plugins block in {path}")
              if "com.google.gms.google-services" not in text[start:end]:
                  text = text[:end] + "    " + plugin_line + "\n" + text[end:]
                  path.write_text(text)

          add_plugin(settings, 'id("com.google.gms.google-services") version "4.5.0" apply false')
          add_plugin(app_gradle, 'id("com.google.gms.google-services")')

          text = app_gradle.read_text()
          if 'import java.util.Properties' not in text:
              text = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + text

          if 'val signingProperties = Properties()' not in text:
              marker = 'plugins {'
              start = text.find(marker)
              depth = 0
              end = -1
              for i in range(start + len(marker) - 1, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end < 0:
                  raise SystemExit("ERROR: Cannot locate app Gradle plugins block end.")
              signing = '''
          
          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("key.properties")
          if (!signingPropertiesFile.exists()) {
              throw GradleException("Missing android/key.properties; configure Android signing secrets.")
          }
          signingProperties.load(FileInputStream(signingPropertiesFile))
          '''
              text = text[:end] + signing + text[end:]

          if 'create("release")' not in text and 'create("daskoRelease")' not in text:
              android_marker = 'android {'
              android_start = text.find(android_marker)
              if android_start < 0:
                  raise SystemExit("ERROR: android block not found in app Gradle file.")
              signing_config = '''
              signingConfigs {
                  create("release") {
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                  }
              }

          '''
              text = text[:android_start + len(android_marker)] + "\n" + signing_config + text[android_start + len(android_marker):]

          text = text.replace('signingConfig = signingConfigs.getByName("debug")',
                              'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              raise SystemExit("ERROR: Could not set release build to the persistent signing config.")
          app_gradle.write_text(text)
          print("Firebase plugin and persistent release signing configured.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Apply Dart formatting before analysis
        run: dart format .

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "test" ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --reporter expanded
          else
            echo "::warning::No *_test.dart files found under test/. Automated tests were not executed."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK"
          else
            echo "::warning::apksigner unavailable on PATH; release signing was configured through Gradle."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dasko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
