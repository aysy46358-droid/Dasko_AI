
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.dasko --project-name dasko_ai .

      - name: Configure Firebase Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing from repository root."
            exit 1
          fi

          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app_gradle.exists():
              raise SystemExit(
                  "ERROR: Expected Kotlin Gradle files were not generated."
              )

          def add_to_plugins(path, line, versioned=False):
              text = path.read_text()
              start = text.find("plugins {")
              if start < 0:
                  raise SystemExit(f"ERROR: plugins block not found in {path}")

              depth = 0
              end = -1
              for i in range(start + len("plugins"), len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break

              if end < 0:
                  raise SystemExit(f"ERROR: Invalid plugins block in {path}")

              if "com.google.gms.google-services" in text[start:end]:
                  print(f"Google Services plugin already configured in {path}")
                  return

              text = text[:end] + "    " + line + "\n" + text[end:]
              path.write_text(text)
              print(f"Configured Google Services plugin in {path}")

          add_to_plugins(
              settings,
              'id("com.google.gms.google-services") version "4.4.4" apply false'
          )
          add_to_plugins(
              app_gradle,
              'id("com.google.gms.google-services")'
          )
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dasko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
