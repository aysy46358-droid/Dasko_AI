name: Format Dart (experimental branch only)

on:
  push:
    branches:
      - experimental-work
    paths:
      - '**.dart'
      - '.github/workflows/format_experimental.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter (includes Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Verify Dart formatting without modifying files
        run: dart format --output=none --set-exit-if-changed lib test
