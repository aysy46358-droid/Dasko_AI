name: Format Dart (experimental branch only)

on:
  push:
    branches:
      - experimental-work
    paths:
      - '**.dart'
      - '.github/workflows/format_experimental.yml'

permissions:
  contents: read

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip formatter]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-work
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter (includes Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart package language version
        run: flutter pub get

      - name: Apply official Dart formatting
        run: dart format .

      - name: Commit formatting changes on experimental branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Dart formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style: apply Dart formatter [skip formatter]"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin HEAD:experimental-work
