name: Format Dart (experimental branch only)

on:
  push:
    branches:
      - experimental-work
    paths:
      - '**.dart'
      - '.github/workflows/format_experimental.yml'

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip formatter]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-work
          fetch-depth: 0

      - name: Set up Flutter (includes Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply official Dart formatting
        run: dart format .

      - name: Commit formatting changes on experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Dart formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style: apply Dart formatter [skip formatter]"
          git push origin HEAD:experimental-work
