name: Analyze UI theme branch

on:
  push:
    branches:
      - cursor/robot-ui-theme
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget and unit tests (informational)
        continue-on-error: true
        run: flutter test
