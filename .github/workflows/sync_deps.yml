name: Sync deps and format

on:
  push:
    branches:
      - refactor/performance-and-ui-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: pub get and dart format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/performance-and-ui-final
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Commit lockfile and formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to sync."
            exit 0
          fi
          git add -A
          git commit -m "chore(deps): refresh lockfile and formatting after webview removal"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refactor/performance-and-ui-final
