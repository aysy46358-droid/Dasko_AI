name: Format audit branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: dart format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: cursor/audit-fixes
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git add -A
          git commit -m "style: apply dart format"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:cursor/audit-fixes
